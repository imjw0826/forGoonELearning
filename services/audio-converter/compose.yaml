services:
  audio-converter:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      CONVERTER_TOKEN: ${CONVERTER_TOKEN:?Set a random 32+ character token}
      PUBLIC_URL: ${PUBLIC_URL:?Set the HTTPS converter URL}
    volumes:
      - audio-jobs:/data/jobs
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m
volumes:
  audio-jobs:
